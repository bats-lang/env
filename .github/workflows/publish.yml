# Publishes this package to bats-lang/repository-prototype when src/ or
# bats.toml changes on main. See PUBLISHING-SETUP.md there. Called by
# commit, which the daily relock moves (bats-lang/repository-prototype#269).
name: publish
on:
  push:
    branches: [main]
    paths: ['src/**', 'bats.toml']
jobs:
  publish:
    uses: bats-lang/repository-prototype/.github/workflows/publish.yml@24a99fdd7a01d7da8cfe34765e3812a16ff05aea # repository-prototype main 24a99fd
    secrets: inherit
