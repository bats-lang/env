name: check

on:
  push:
    branches: [main]
  # A draft pull request runs no job (package-check.yml, keyword: draft-ci), so
  # marking it ready must start the check: ready_for_review is added to the
  # default types
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # The daily relock dispatches it on its relock/<date> branch: a pull
  # request opened with GITHUB_TOKEN starts no workflow by itself
  workflow_dispatch:

jobs:
  check:
    uses: bats-lang/repository-prototype/.github/workflows/package-check.yml@24a99fdd7a01d7da8cfe34765e3812a16ff05aea # repository-prototype main 24a99fd
